name: adria-bank

x-backend: &backend
  restart: unless-stopped
  environment: &backend-env
    EUREKA_URL: http://discovery-service:19761/eureka/
    CONFIG_SERVER_URL: http://config-service:19888

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 3s
  retries: 30
  start_period: 20s

services:
  # Authentification : realm, clients et utilisateurs importes depuis keycloak/realm.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:18180
      KC_HEALTH_ENABLED: "true"
    ports: ["18180:8080"]
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - ./keycloak/themes/adria:/opt/keycloak/themes/adria:ro
    healthcheck:
      <<: *healthcheck
      # L'image ne contient pas curl : requete HTTP brute sur le port de management.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  discovery-service:
    <<: *backend
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: discovery-service } }
    image: adria-bank/discovery-service
    ports: ["19761:19761"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:19761/actuator/health"]

  config-service:
    <<: *backend
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: config-service } }
    image: adria-bank/config-service
    ports: ["19888:19888"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:19888/actuator/health"]

  account-service:
    <<: *backend
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: account-service } }
    image: adria-bank/account-service
    ports: ["19081:19081"]
    depends_on:
      discovery-service: { condition: service_healthy }
      config-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:19081/actuator/health"]

  transaction-service:
    <<: *backend
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: transaction-service } }
    image: adria-bank/transaction-service
    ports: ["19082:19082"]
    environment:
      <<: *backend-env
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      discovery-service: { condition: service_healthy }
      config-service: { condition: service_healthy }
      account-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:19082/actuator/health"]

  gateway-service:
    <<: *backend
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: gateway-service } }
    image: adria-bank/gateway-service
    ports: ["19080:19080"]
    environment:
      <<: *backend-env
      SECURITY_ENABLED: "true"
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/adria-bank/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:18180/realms/adria-bank
    depends_on:
      discovery-service: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:19080/actuator/health"]

  frontend:
    build:
      context: ./frontend
      args: { VITE_KEYCLOAK_URL: "http://localhost:18180" }
    image: adria-bank/frontend
    restart: unless-stopped
    ports: ["15173:80"]
    depends_on:
      gateway-service: { condition: service_healthy }

  # Optionnel : docker compose --profile ai up (GEMINI_API_KEY dans .env)
  chatbot-service:
    <<: *backend
    profiles: [ai]
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: chatbot-service } }
    image: adria-bank/chatbot-service
    ports: ["19083:19083"]
    environment:
      <<: *backend-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ACCOUNT_MCP_URL: http://account-service:19081
      TRANSACTION_MCP_URL: http://transaction-service:19082
    depends_on:
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:19083/actuator/health"]

  # Optionnel : docker compose --profile kafka up (KAFKA_ENABLED=true dans .env)
  kafka:
    profiles: [kafka]
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  event-consumer:
    <<: *backend
    profiles: [kafka]
    build: { context: ., dockerfile: backend/Dockerfile, args: { SERVICE: event-consumer } }
    image: adria-bank/event-consumer
    ports: ["19084:19084"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: [kafka]
