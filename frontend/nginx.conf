server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Meme role que le proxy Vite : /api part vers la gateway.
    location /api/ {
        proxy_pass http://gateway-service:19080;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
