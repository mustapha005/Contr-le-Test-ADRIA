server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: accounts
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**
            - id: transactions
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**
            - id: chatbot
              uri: lb://chatbot-service
              predicates:
                - Path=/api/chat/**
            - id: accounts-graphql
              uri: lb://account-service
              predicates:
                - Path=/accounts/graphql
              filters:
                - SetPath=/graphql
            - id: transactions-graphql
              uri: lb://transaction-service
              predicates:
                - Path=/transactions/graphql
              filters:
                - SetPath=/graphql
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
