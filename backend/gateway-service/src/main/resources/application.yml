server:
  port: 19080
spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Cles lues dans le reseau Docker, emetteur tel que vu par le navigateur.
          jwk-set-uri: ${KEYCLOAK_JWKS_URL:http://localhost:18180/realms/adria-bank/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:18180/realms/adria-bank}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: accounts
              uri: lb://account-service
              predicates:
                - Path=/api/accounts/**
            - id: transactions
              uri: lb://transaction-service
              predicates:
                - Path=/api/transactions/**
            - id: chatbot
              uri: lb://chatbot-service
              predicates:
                - Path=/api/chat/**
            - id: accounts-graphql
              uri: lb://account-service
              predicates:
                - Path=/accounts/graphql
              filters:
                - SetPath=/graphql
            - id: transactions-graphql
              uri: lb://transaction-service
              predicates:
                - Path=/transactions/graphql
              filters:
                - SetPath=/graphql
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:19761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
bank:
  security:
    enabled: ${SECURITY_ENABLED:false}
