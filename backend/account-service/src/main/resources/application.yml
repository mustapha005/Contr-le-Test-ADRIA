server:
  port: 19081
spring:
  application:
    name: account-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:19888}
  datasource:
    url: jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  graphql:
    graphiql:
      enabled: true
  ai:
    mcp:
      server:
        name: account-service
        protocol: STREAMABLE
        type: SYNC
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:19761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
bank:
  transaction:
    max-amount: 1000
