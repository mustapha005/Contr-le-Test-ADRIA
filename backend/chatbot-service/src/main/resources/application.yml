server:
  port: 8083
spring:
  application:
    name: chatbot-service
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
            temperature: 0.1
            max-output-tokens: 1024
    mcp:
      client:
        name: bank-assistant
        type: SYNC
        request-timeout: 20s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            accounts:
              url: ${ACCOUNT_MCP_URL:http://localhost:8081}
            transactions:
              url: ${TRANSACTION_MCP_URL:http://localhost:8082}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
